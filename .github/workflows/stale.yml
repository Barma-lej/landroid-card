name: Close inactive issues
on:
  schedule:
    - cron: "30 1 * * *" # Запускается ежедневно в 01:30 ночи

jobs:
  close-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          
          # Настройки для Issue
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: "stale"
          exempt-issue-labels: "bug, enhancement, help wanted" # Ярлыки, которые экшен не будет трогать
          stale-issue-message: "This issue has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs. Thank you for your contributions."
          close-issue-message: "This issue has been closed due to inactivity. If you feel this is still relevant, please feel free to reopen it."
          
          # Настройки для Pull Requests (отключено)
          # Если хочешь включить для PR, измени -1 на количество дней
          days-before-pr-stale: -1
          days-before-pr-close: -1
        